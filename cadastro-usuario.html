<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cadastroUsuario.css">
    <title>Flash View</title>
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">

</head>

<body>

    <div class="container">
        <h1>Flash View</h1>
        <h3>Cadastro de Usuário</h3>
        <form id="form-usuario" class="formulario">

            <p>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </p>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </p>

            <button type="submit">Cadastrar</button>
            <p id="mensagem" role="status" aria-live="polite"></p>
            <p>Ja tem uma conta?: <a href="login.html">Faça seu Login</a></p>
        </form>
    </div>
    <script>
        const API_URL = 'http://localhost:3000';

        const form = document.getElementById('form-usuario');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (event) => {
        
        event.preventDefault();

        const novoUsuario = {
            cpf: document.getElementById('cpf').value,
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
        };

        mensagem.textContent = 'Cadastrando...';
        mensagem.style.color = 'blue';

        try {
            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(novoUsuario),
            });

            if (!response.ok) {
                const erro = await response.json();
                throw new Error(erro.message || `Erro ${response.status}`);
            }

            const usuarioCriado = await response.json();

            mensagem.textContent = `Usuário "${usuarioCriado.nome || novoUsuario.nome}" cadastrado com sucesso. Redirecionando...`;
            mensagem.style.color = 'green';
            window.location.href = 'login.html';

        } catch (error) {
            console.error('Erro:', error);
            mensagem.textContent = `Erro: ${error.message || 'erro inesperado, tente novamente.'}`;
            mensagem.style.color = 'red';
        }
    });
</script>


</body>
</html>
