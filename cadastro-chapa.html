<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Nova Chapa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">
            <img src="assets/logo.ico" alt="Flash View" style="width: 48px; height: 48px; object-fit: contain;">
        </a>
        <h1 class="mb-0">Cadastrar Nova Chapa</h1>
    </div>
    <hr>

    <form id="form-chapa" class="row g-3">
        <div class="col-md-6">
            <label for="funcionarioId" class="form-label">ID do Funcionário</label>
            <input type="text" class="form-control" id="funcionarioId" placeholder="ID do funcionário" required>
        </div>

        <div class="col-md-6">
            <label for="blocoId" class="form-label">Bloco proveniente</label>
            <select class="form-select" id="blocoId" required>
                <option value="">Carregando blocos...</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="codigo" class="form-label">Código da chapa</label>
            <input type="text" class="form-control" id="codigo" maxlength="50" placeholder="Ex.: CH-000004" required>
        </div>

        <div class="col-md-6">
            <label for="acabamento" class="form-label">Acabamento</label>
            <input type="text" class="form-control" id="acabamento" maxlength="150" placeholder="Ex.: Polido">
        </div>

        <div class="col-md-4">
            <label for="espessura" class="form-label">Espessura</label>
            <input type="number" class="form-control" id="espessura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="largura" class="form-label">Largura</label>
            <input type="number" class="form-control" id="largura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="altura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="altura" min="0.01" step="0.01">
        </div>

        <div class="col-md-6">
            <label for="imagem" class="form-label">Imagem da chapa</label>
            <input type="file" class="form-control" id="imagem" accept="image/*">
        </div>

        <div class="col-12">
            <img id="preview-imagem" src="" alt="Prévia da imagem" class="img-fluid rounded border d-none" style="max-height: 220px;">
        </div>

        <div class="col-12">
            <div id="mensagem" class="alert d-none" role="alert"></div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" id="btn-salvar" class="btn btn-success">Salvar Chapa</button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <script src="js/api.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';

        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('btn-salvar');
        const selectBloco = document.getElementById('blocoId');
        const inputImagem = document.getElementById('imagem');
        const previewImagem = document.getElementById('preview-imagem');

        let imagemSelecionada = null;
        let urlPreview = null;

        function mostrarMensagem(texto, tipo = 'danger') {
            mensagem.textContent = texto;
            mensagem.className = `alert alert-${tipo}`;
        }

        function esconderMensagem() {
            mensagem.className = 'alert d-none';
            mensagem.textContent = '';
        }

        // O backend recebe o ID do bloco (não o código), então listamos os blocos para escolher
        async function carregarBlocos() {
            try {
                const dados = await api('/blocos');
                const blocos = Array.isArray(dados) ? dados : (dados?.data ?? []);

                selectBloco.innerHTML = '<option value="">Selecione o bloco</option>';

                blocos.forEach(bloco => {
                    const option = document.createElement('option');
                    option.value = bloco.id;
                    option.textContent = [bloco.codigo, bloco.material, bloco.cor]
                        .filter(Boolean)
                        .join(' — ');
                    selectBloco.appendChild(option);
                });

                if (blocos.length === 0) {
                    selectBloco.innerHTML = '<option value="">Nenhum bloco cadastrado</option>';
                }
            } catch (error) {
                console.error('Erro ao carregar blocos:', error);
                selectBloco.innerHTML = '<option value="">Erro ao carregar blocos</option>';
                mostrarMensagem(`Não foi possível carregar os blocos: ${error.message}`);
            }
        }

        inputImagem.addEventListener('change', (event) => {
            const file = event.target.files[0];

            if (urlPreview) {
                URL.revokeObjectURL(urlPreview);
                urlPreview = null;
            }

            imagemSelecionada = file || null;

            if (!file) {
                previewImagem.src = '';
                previewImagem.classList.add('d-none');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                inputImagem.value = '';
                imagemSelecionada = null;
                previewImagem.classList.add('d-none');
                mostrarMensagem('A imagem deve ter no máximo 10 MB.');
                return;
            }

            esconderMensagem();
            urlPreview = URL.createObjectURL(file);
            previewImagem.src = urlPreview;
            previewImagem.classList.remove('d-none');
        });

        // Envia a imagem como arquivo (multipart), nunca em base64 no JSON
        async function enviarImagemChapa(id, arquivo) {
            const formData = new FormData();
            formData.append('imagem', arquivo);

            const token = localStorage.getItem('token');

            const resposta = await fetch(
                `${API_URL}/chapas/${encodeURIComponent(id)}/imagem`,
                {
                    method: 'POST',
                    headers: token ? { Authorization: `Bearer ${token}` } : {},
                    body: formData
                }
            );

            if (!resposta.ok) {
                const erro = await resposta.json().catch(() => ({}));
                const detalhe = Array.isArray(erro.message)
                    ? erro.message.join(', ')
                    : erro.message || '';
                throw new Error(`Falha ao enviar a imagem. ${detalhe}`);
            }
        }

        function numeroOpcional(id) {
            const valor = document.getElementById(id).value;
            return valor === '' ? undefined : Number(valor);
        }

        document.getElementById('form-chapa').addEventListener('submit', async (event) => {
            event.preventDefault();
            esconderMensagem();

            // Só os campos que o backend aceita (ele recusa campos desconhecidos)
            const novaChapa = {
                funcionarioId: document.getElementById('funcionarioId').value.trim(),
                blocoId: selectBloco.value,
                codigo: document.getElementById('codigo').value.trim()
            };

            const espessura = numeroOpcional('espessura');
            const altura = numeroOpcional('altura');
            const largura = numeroOpcional('largura');
            const acabamento = document.getElementById('acabamento').value.trim();

            if (espessura !== undefined) novaChapa.espessura = espessura;
            if (altura !== undefined) novaChapa.altura = altura;
            if (largura !== undefined) novaChapa.largura = largura;
            if (acabamento !== '') novaChapa.acabamento = acabamento;

            if (!novaChapa.blocoId) {
                mostrarMensagem('Selecione o bloco proveniente.');
                return;
            }

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            let chapaCriada = false;

            try {
                const criada = await api('/chapas', {
                    method: 'POST',
                    body: JSON.stringify(novaChapa)
                });

                chapaCriada = true;

                if (imagemSelecionada) {
                    if (!criada || !criada.id) {
                        throw new Error('A chapa foi cadastrada, mas a API não retornou o ID para enviar a imagem. Não cadastre novamente.');
                    }

                    botaoSalvar.textContent = 'Enviando imagem...';
                    await enviarImagemChapa(criada.id, imagemSelecionada);
                }

                mostrarMensagem('Chapa cadastrada com sucesso!', 'success');

                setTimeout(() => {
                    window.location.href = 'historicoBlocosChapas.html';
                }, 1000);

            } catch (error) {
                console.error('Erro ao cadastrar chapa:', error);

                if (chapaCriada) {
                    mostrarMensagem(`${error.message} A chapa já foi cadastrada, não envie o formulário de novo.`);
                    botaoSalvar.textContent = 'Chapa já cadastrada';
                    return;
                }

                mostrarMensagem(`Erro ao cadastrar: ${error.message}`);
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = 'Salvar Chapa';
            }
        });

        carregarBlocos();
    </script>
</body>

</html>
