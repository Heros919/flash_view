<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Novo Bloco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">
            <img src="assets/logo.ico" alt="Flash View" style="width: 48px; height: 48px; object-fit: contain;">
        </a>
        <h1 class="mb-0">Cadastrar Nova Chapa</h1>
    </div>
    <hr>

    <form id="form-chapa" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Código do bloco proveniente</label>
            <input type="text" class="form-control" id="codigoBloco" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Material</label>
            <input type="text" class="form-control" id="material" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Cor</label>
            <input type="text" class="form-control" id="cor" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Comprimento (cm)</label>
            <input type="number" class="form-control" id="comprimento" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Largura (cm)</label>
            <input type="number" class="form-control" id="largura" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Altura (cm)</label>
            <input type="number" class="form-control" id="altura" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Peso (kg)</label>
            <input type="number" class="form-control" id="peso" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Imagem da chapa</label>
            <input type="file" class="form-control" id="imagem" accept="image/*">
        </div>

        <div class="col-12">
            <img id="preview-imagem" src="" alt="Prévia da imagem" class="img-fluid rounded border d-none" style="max-height: 220px;">
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar Chapa</button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <script>
        const API_URL = 'http://localhost:3000';

        const inputImagem = document.getElementById('imagem');
        const previewImagem = document.getElementById('preview-imagem');
        let imagemSelecionada = '';

        inputImagem.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) {
                imagemSelecionada = '';
                previewImagem.src = '';
                previewImagem.classList.add('d-none');
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                if (typeof reader.result !== 'string') {
                    alert('Não foi possível carregar a imagem selecionada.');
                    return;
                }

                imagemSelecionada = reader.result;
                previewImagem.src = imagemSelecionada;
                previewImagem.classList.remove('d-none');
            };
            reader.onerror = () => {
                alert('Não foi possível carregar a imagem selecionada.');
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('form-chapa').addEventListener('submit', async (event) => {
            event.preventDefault();

            const novaChapa = {
                codigoBlocoProveniente: document.getElementById('codigoBloco').value,
                material: document.getElementById('material').value,
                cor: document.getElementById('cor').value,
                comprimento: parseFloat(document.getElementById('comprimento').value),
                largura: parseFloat(document.getElementById('largura').value),
                altura: parseFloat(document.getElementById('altura').value),
                peso: parseFloat(document.getElementById('peso').value),
                imagem: imagemSelecionada
            };

            try {
                const response = await fetch(`${API_URL}/chapas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(novaChapa)
                });

                if (response.ok) {
                    alert('Chapa cadastrada com sucesso!');
                    window.location.href = 'historicoBlocosChapas.html';
                } else {
                    const erro = await response.json().catch(() => ({}));
                    alert('Erro ao cadastrar: ' + (erro.message || 'Verifique os dados.'));
                }

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>

</html>
