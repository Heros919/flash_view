<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Nova Chapa</title>
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-dark-blue: #061426;
            --brand-yellow: #FFD700;
            --brand-blue: #00B0FF;
            --input-bg: #0d233a;
            --input-border: #1c3a5a;
            --text-muted: #8b9eb0;
            --bg-card: #0a111a;
        }

        body {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding-bottom: 3rem;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 0;
        }

        hr {
            border-color: var(--input-border);
            opacity: 1;
            margin-bottom: 2rem;
        }

        form#form-chapa {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-control, .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--brand-blue);
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 176, 255, 0.15);
        }

        .form-control::placeholder {
            color: #4a627a;
        }

        .form-select option {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
        }

        .form-text {
            color: var(--text-muted) !important;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .form-control[type="file"] {
            padding: 0.5rem;
        }

        .form-control[type="file"]::file-selector-button {
            background-color: var(--input-border);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            transition: all 0.2s;
        }

        .form-control[type="file"]::file-selector-button:hover {
            background-color: var(--brand-blue);
            color: #000;
        }

        .btn-success {
            background-color: var(--brand-blue);
            border-color: var(--brand-blue);
            color: #000;
            font-weight: 600;
            padding: 0.75rem 2rem;
        }

        .btn-success:hover {
            background-color: #0099cc;
            border-color: #0099cc;
            color: #000;
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--input-border);
            color: var(--text-muted);
            padding: 0.75rem 2rem;
        }

        .btn-secondary:hover {
            background-color: var(--input-border);
            color: #ffffff;
        }

        .alert-success {
            background-color: rgba(25, 135, 84, 0.1);
            color: #75b798;
            border: 1px solid rgba(25, 135, 84, 0.3);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>

<body class="container mt-5">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">
            <img src="assets/logoFlashViewRecortada.png" alt="Flash View" style="max-height: 48px; object-fit: contain;">
        </a>
        <h1 class="mb-0">Cadastrar Nova Chapa</h1>
    </div>
    <hr>

    <form id="form-chapa" class="row g-3">
            <div class="col-md-6" id="funcionario-container">
                <label for="funcionarioId" class="form-label">Funcionário responsável</label>
                <select class="form-select" id="funcionarioId" required>
                    <option value="">Carregando funcionários...</option>
                </select>
                <div id="ajuda-funcionario" class="form-text">
                    Selecione o funcionário responsável.
                </div>
            </div>
            <div class="col-md-6" id="administrador-container" hidden>
                <label for="administradorId" class="form-label">ID do Administrador responsável</label>
                <input class="form-control" id="administradorId" readonly>
                <div class="form-text">A chapa será associada à sua conta e ao cliente do bloco.</div>
            </div>

        <div class="col-md-6">
            <label for="blocoId" class="form-label">Bloco proveniente</label>
            <select class="form-select" id="blocoId" required>
                <option value="">Carregando blocos...</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="codigo" class="form-label">Código da chapa</label>
            <input type="text" class="form-control" id="codigo" maxlength="50" placeholder="Ex.: CH-000004" required>
        </div>

        <div class="col-md-6">
            <label for="acabamento" class="form-label">Acabamento</label>
            <input type="text" class="form-control" id="acabamento" maxlength="150" placeholder="Ex.: Polido">
        </div>

        <div class="col-md-4">
            <label for="espessura" class="form-label">Espessura</label>
            <input type="number" class="form-control" id="espessura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="largura" class="form-label">Largura</label>
            <input type="number" class="form-control" id="largura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="altura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="altura" min="0.01" step="0.01">
        </div>

        <div class="col-md-6">
            <label for="imagem" class="form-label">Imagens da chapa (até 5)</label>
            <input type="file" class="form-control" id="imagem" name="imagens" accept="image/*" multiple>
        </div>

        <div class="col-12">
            <div id="contador-imagens" class="form-text">0/5 imagens</div>
            <div id="galeria-imagens" class="d-flex flex-wrap gap-3"></div>
        </div>

        <div class="col-12">
            <div id="mensagem" class="alert d-none" role="alert"></div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" id="btn-salvar" class="btn btn-success">Salvar Chapa</button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <script src="js/api.js"></script>
    <script src="js/multiplas-imagens.js"></script>
    <script>
        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('btn-salvar');
        const selectFuncionario = document.getElementById('funcionarioId');
        const selectBloco = document.getElementById('blocoId');
        const contaLogada = JSON.parse(localStorage.getItem('usuario') || 'null');
        const galeriaImagens = window.criarGaleriaImagens({
            recurso: 'chapas',
            input: document.getElementById('imagem'),
            galeria: document.getElementById('galeria-imagens'),
            contador: document.getElementById('contador-imagens'),
            aoErro: (texto) => mostrarMensagem(texto),
        });

        function mostrarMensagem(texto, tipo = 'danger') {
            mensagem.textContent = texto;
            mensagem.className = `alert alert-${tipo}`;
        }

        function esconderMensagem() {
            mensagem.className = 'alert d-none';
            mensagem.textContent = '';
        }

        async function carregarFuncionariosResponsaveis() {
            const ajudaFuncionario = document.getElementById('ajuda-funcionario');
            if (contaLogada?.papel === 'ADMINISTRADOR') {
                document.getElementById('funcionario-container').hidden = true;
                document.getElementById('administrador-container').hidden = false;
                document.getElementById('administradorId').value = contaLogada.id;
                selectFuncionario.required = false;
                return;
            }

            if (contaLogada?.papel === 'FUNCIONARIO') {
                const opcao = document.createElement('option');
                opcao.value = String(contaLogada.id);
                opcao.textContent = `${contaLogada.nome} — ${contaLogada.id}`;
                opcao.dataset.clienteId = String(contaLogada.cliente_id);
                selectFuncionario.replaceChildren(opcao);
                selectFuncionario.disabled = true;
                ajudaFuncionario.textContent =
                    'Funcionário responsável preenchido automaticamente pela sua conta.';
                filtrarBlocosPorFuncionario();
                return;
            }

            try {
                const funcionarios = await api('/auth/funcionarios-responsaveis');
                if (!Array.isArray(funcionarios)) {
                    throw new Error('A API retornou uma lista de funcionários inválida.');
                }

                selectFuncionario.innerHTML =
                    '<option value="">Selecione o funcionário responsável</option>';
                funcionarios.forEach((funcionario) => {
                    const opcao = document.createElement('option');
                    opcao.value = funcionario.id;
                    opcao.textContent = `${funcionario.nome} — ${funcionario.id}`;
                    opcao.dataset.clienteId = String(funcionario.cliente_id);
                    selectFuncionario.appendChild(opcao);
                });

                if (funcionarios.length === 0) {
                    selectFuncionario.innerHTML =
                        '<option value="">Nenhum funcionário cadastrado</option>';
                    selectFuncionario.disabled = true;
                    ajudaFuncionario.textContent =
                        'Cadastre um funcionário antes de criar a chapa.';
                }
            } catch (error) {
                selectFuncionario.innerHTML =
                    '<option value="">Erro ao carregar funcionários</option>';
                selectFuncionario.disabled = true;
                mostrarMensagem(
                    `Não foi possível carregar os funcionários: ${error.message}`
                );
            }
        }

        const blocosDisponiveis = [];
        function filtrarBlocosPorFuncionario() {
            const podeAcessarTodosClientes =
                contaLogada?.papel === 'ADMINISTRADOR' ||
                contaLogada?.papel === 'FUNCIONARIO';
            const clienteId = podeAcessarTodosClientes
                ? null
                : selectFuncionario.selectedOptions[0]?.dataset.clienteId;
            const blocos = podeAcessarTodosClientes
                ? blocosDisponiveis
                : blocosDisponiveis.filter(
                    (bloco) => String(bloco.cliente_id) === clienteId
                );

            selectBloco.innerHTML = podeAcessarTodosClientes || clienteId
                ? '<option value="">Selecione o bloco</option>'
                : '<option value="">Selecione primeiro o funcionário</option>';
            blocos.forEach((bloco) => {
                const option = document.createElement('option');
                option.value = bloco.id;
                option.textContent = [bloco.codigo, bloco.material, bloco.cor]
                    .filter(Boolean)
                    .join(' — ');
                selectBloco.appendChild(option);
            });

            if ((podeAcessarTodosClientes || clienteId) && blocos.length === 0) {
                selectBloco.innerHTML =
                    '<option value="">Nenhum bloco disponível</option>';
            }
        }

        async function carregarBlocos() {
            try {
                const dados = await api('/blocos');
                const blocos = Array.isArray(dados) ? dados : (dados?.data ?? []);
                blocosDisponiveis.push(...blocos);
                filtrarBlocosPorFuncionario();
            } catch (error) {
                console.error('Erro ao carregar blocos:', error);
                selectBloco.innerHTML = '<option value="">Erro ao carregar blocos</option>';
                mostrarMensagem(`Não foi possível carregar os blocos: ${error.message}`);
            }
        }

        selectFuncionario.addEventListener('change', filtrarBlocosPorFuncionario);
        carregarFuncionariosResponsaveis();
        carregarBlocos();

        function numeroOpcional(id) {
            const valor = document.getElementById(id).value;
            return valor === '' ? undefined : Number(valor);
        }

        document.getElementById('form-chapa').addEventListener('submit', async (event) => {
            event.preventDefault();
            esconderMensagem();

            const ehAdministrador = contaLogada?.papel === 'ADMINISTRADOR';
            const funcionarioId = selectFuncionario.value.trim();
            if (!ehAdministrador && !funcionarioId) {
                mostrarMensagem('Selecione um funcionário responsável válido.');
                return;
            }

            const novaChapa = {
                blocoId: selectBloco.value,
                codigo: document.getElementById('codigo').value.trim()
            };

            if (!ehAdministrador) {
                novaChapa.funcionarioId = funcionarioId;
            }

            const espessura = numeroOpcional('espessura');
            const altura = numeroOpcional('altura');
            const largura = numeroOpcional('largura');
            const acabamento = document.getElementById('acabamento').value.trim();

            if (espessura !== undefined) novaChapa.espessura = espessura;
            if (altura !== undefined) novaChapa.altura = altura;
            if (largura !== undefined) novaChapa.largura = largura;
            if (acabamento !== '') novaChapa.acabamento = acabamento;

            if (!novaChapa.blocoId) {
                mostrarMensagem('Selecione o bloco proveniente.');
                return;
            }

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            let chapaCriada = false;

            try {
                const criada = await api('/chapas', {
                    method: 'POST',
                    body: JSON.stringify(novaChapa)
                });

                chapaCriada = true;
                const possuiImagens = galeriaImagens.selecionadas.length > 0;

                if (possuiImagens) {
                    if (!criada || !criada.id) {
                        throw new Error('A chapa foi cadastrada, mas a API não retornou o ID para enviar as imagens. Não cadastre novamente.');
                    }

                    botaoSalvar.textContent = 'Enviando imagens...';
                    await galeriaImagens.enviar(criada.id);
                }

                mostrarMensagem(
                    possuiImagens
                        ? 'Chapa e imagens cadastradas com sucesso!'
                        : 'Chapa cadastrada com sucesso!',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = 'historicoBlocosChapas.html';
                }, 1000);

            } catch (error) {
                console.error('Erro ao cadastrar chapa:', error);

                if (chapaCriada) {
                    mostrarMensagem(`${error.message} A chapa já foi cadastrada, não envie o formulário de novo.`);
                    botaoSalvar.textContent = 'Chapa já cadastrada';
                    return;
                }

                mostrarMensagem(`Erro ao cadastrar: ${error.message}`);
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = 'Salvar Chapa';
            }
        });
    </script>
</body>

</html>
