<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Editar Chapa</title>
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">
            <img src="assets/logo.ico" alt="Flash View" style="width: 48px; height: 48px; object-fit: contain;">
        </a>
        <h1 class="mb-0">Editar Chapa</h1>
    </div>
    <hr>

    <div id="mensagem" class="alert d-none" role="alert"></div>

    <form id="form-editar-chapa" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Bloco proveniente</label>
            <input type="text" class="form-control" id="blocoOrigem" readonly disabled>
            <div class="form-text">O bloco de origem não pode ser alterado.</div>
        </div>

        <div class="col-md-6">
            <label for="codigo" class="form-label">Código da chapa</label>
            <input type="text" class="form-control" id="codigo" maxlength="50" required>
        </div>

        <div class="col-md-6">
            <label for="acabamento" class="form-label">Acabamento</label>
            <input type="text" class="form-control" id="acabamento" maxlength="150">
        </div>

        <div class="col-md-6"></div>

        <div class="col-md-4">
            <label for="espessura" class="form-label">Espessura</label>
            <input type="number" class="form-control" id="espessura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="largura" class="form-label">Largura</label>
            <input type="number" class="form-control" id="largura" min="0.01" step="0.01">
        </div>
        <div class="col-md-4">
            <label for="altura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="altura" min="0.01" step="0.01">
        </div>

        <div class="col-md-6">
            <label for="imagem" class="form-label">Imagens da chapa (até 5)</label>
            <input type="file" class="form-control" id="imagem" name="imagens" accept="image/*" multiple>
        </div>

        <div class="col-12">
            <div id="contador-imagens" class="form-text">0/5 imagens</div>
            <div id="galeria-imagens" class="d-flex flex-wrap gap-3"></div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar Alterações</button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">Voltar</a>
        </div>
    </form>

    <script src="js/api.js"></script>
    <script src="js/multiplas-imagens.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const chapaId = params.get('id');

        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('btn-salvar');

        function mostrarMensagem(texto, tipo = 'danger') {
            mensagem.textContent = texto;
            mensagem.className = `alert alert-${tipo}`;
        }

        const galeriaImagens = window.criarGaleriaImagens({
            recurso: 'chapas',
            input: document.getElementById('imagem'),
            galeria: document.getElementById('galeria-imagens'),
            contador: document.getElementById('contador-imagens'),
            aoErro: (texto) => mostrarMensagem(texto),
        });

        async function carregarChapa() {
            if (!chapaId) {
                alert('Chapa não informada.');
                window.location.href = 'historicoBlocosChapas.html';
                return;
            }

            try {
                const chapa = await api(`/chapas/${encodeURIComponent(chapaId)}`);
                console.log('Chapa carregada:', chapa);

                const bloco = chapa.bloco || {};

                document.getElementById('blocoOrigem').value =
                    [bloco.codigo, bloco.material, bloco.cor].filter(Boolean).join(' — ') || '—';

                document.getElementById('codigo').value = chapa.codigo ?? '';
                document.getElementById('acabamento').value = chapa.acabamento ?? '';
                document.getElementById('espessura').value = chapa.espessura ?? '';
                document.getElementById('largura').value = chapa.largura ?? '';
                document.getElementById('altura').value = chapa.altura ?? '';

                await galeriaImagens.carregar(chapaId);
            } catch (error) {
                console.error('Erro ao carregar chapa:', error);
                alert('Erro ao carregar os dados da chapa: ' + error.message);
                window.location.href = 'historicoBlocosChapas.html';
            }
        }

        function numeroOpcional(id) {
            const valor = document.getElementById(id).value;
            return valor === '' ? undefined : Number(valor);
        }

        document.getElementById('form-editar-chapa').addEventListener('submit', async (event) => {
            event.preventDefault();

            const chapaAtualizada = {
                codigo: document.getElementById('codigo').value.trim(),
                acabamento: document.getElementById('acabamento').value.trim()
            };

            const espessura = numeroOpcional('espessura');
            const altura = numeroOpcional('altura');
            const largura = numeroOpcional('largura');

            if (espessura !== undefined) chapaAtualizada.espessura = espessura;
            if (altura !== undefined) chapaAtualizada.altura = altura;
            if (largura !== undefined) chapaAtualizada.largura = largura;

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            try {
                await api(`/chapas/${encodeURIComponent(chapaId)}`, {
                    method: 'PATCH',
                    body: JSON.stringify(chapaAtualizada)
                });

                if (galeriaImagens.selecionadas.length > 0) {
                    botaoSalvar.textContent = 'Enviando imagens...';
                    await galeriaImagens.enviar(chapaId);
                }

                mostrarMensagem('Chapa atualizada com sucesso!', 'success');

                setTimeout(() => {
                    window.location.href = 'historicoBlocosChapas.html';
                }, 1000);
            } catch (error) {
                console.error('Erro ao atualizar chapa:', error);
                mostrarMensagem('Erro ao atualizar chapa: ' + error.message);
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = 'Salvar Alterações';
            }
        });

        carregarChapa();
    </script>
</body>
</html>
