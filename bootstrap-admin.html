<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Configurar acessos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">

    <style>
        :root {
            --bg-dark-blue: #061426;
            --brand-yellow: #FFD700;
            --brand-blue: #00B0FF;
            --input-bg: #0d233a;
            --input-border: #1c3a5a;
            --text-muted: #8b9eb0;
        }

        body {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .bg-image-side {
            background-image: linear-gradient(to bottom, rgba(6, 20, 38, 0.7), rgba(6, 20, 38, 1)), url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .cadastro {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            max-height: 100vh;
            overflow-y: auto;
        }

        .cadastro::-webkit-scrollbar {
            width: 0px;
        }

        .cabecalho {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .cabecalho h1 {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.5rem;
            color: var(--brand-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            font-size: 0;
        }

        .cabecalho h1::before {
            content: "FLASH";
            font-size: 1.5rem;
        }

        .cabecalho h1::after {
            content: "VIEW";
            color: var(--brand-yellow);
            font-size: 1.5rem;
        }

        .cabecalho h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .cabecalho p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .perfil-selector .btn {
            border-color: var(--input-border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .perfil-selector .btn.active {
            border-color: var(--brand-yellow);
            color: var(--brand-yellow);
            background-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .form-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .formulario h3 {
            font-size: 1.2rem;
            color: var(--brand-yellow);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--input-border);
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .campo label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .campo input {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .campo input:focus {
            outline: none;
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(0, 176, 255, 0.15);
        }

        .campo input::placeholder {
            color: #4a627a;
        }

        .mensagem {
            font-size: 0.85rem;
            text-align: center;
            border-radius: 4px;
            transition: all 0.3s;
            margin: 0;
            margin-top: 0.5rem;
        }

        .mensagem.erro {
            padding: 0.5rem;
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .mensagem.sucesso {
            padding: 0.5rem;
            background-color: rgba(25, 135, 84, 0.1);
            color: #75b798;
            border: 1px solid rgba(25, 135, 84, 0.3);
        }

        #admin-botao {
            background: linear-gradient(90deg, var(--brand-yellow) calc(100% - 60px), var(--brand-blue) calc(100% - 60px));
            color: #000000;
            border: none;
            padding: 0.8rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
            width: 100%;
            position: relative;
        }

        #admin-botao::after {
            content: "\F138";
            font-family: "bootstrap-icons";
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: normal;
        }

        #admin-botao:hover:not(:disabled) {
            opacity: 0.9;
        }

        #admin-botao:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .rodape {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            line-height: 1.6;
        }

        .rodape a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .rodape a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            
            <div class="col-md-7 d-none d-md-flex flex-column justify-content-between bg-image-side p-5">
                <div class="mt-5">
                    <p class="text-warning fw-bold text-uppercase mb-0" style="letter-spacing: 2px; font-size: 0.8rem;">
                        — Controle Operacional Inteligente
                    </p>
                </div>
                <div class="mb-5">
                    <h1 class="display-3 fw-bold" style="line-height: 1.1;">
                        Gestão de blocos<br>
                        <span class="text-info" style="color: var(--brand-blue) !important;">e chapas</span>
                    </h1>
                </div>
            </div>

            <div class="col-md-5 d-flex align-items-center justify-content-center">
                
                <main class="cadastro">
                    <header class="cabecalho">
                        <img src="assets/logoFlashViewRecortada.png" alt="Flash View Logo" style="width: 120px; margin-bottom: 1rem;">
                        <h1>Flash View</h1>
                        <h2>Cadastro do Administrador</h2>
                        <p>Informe os dados para criar ou atualizar o acesso do Administrador.</p>
                    </header>

                    <div class="mb-4">
                        <label class="form-label d-block mb-2">Perfil de Acesso</label>
                        <div class="d-flex gap-2 perfil-selector" id="perfilSelector">
                            <button type="button" class="btn btn-outline-secondary flex-fill active" onclick="window.location.href='bootstrap-admin.html'">Administrador</button>
                            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="window.location.href='bootstrap-financeiro.html'">Financeiro</button>
                            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="window.location.href='cadastro-usuario.html'">Funcionário</button>
                        </div>
                    </div>

                    <form id="form-admin" class="formulario">
                        <h3>Administrador</h3>
                        <div class="campo">
                            <label for="admin-cpf">CPF (11 números)</label>
                            <input placeholder="Digite seu CPF" id="admin-cpf" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" required>
                        </div>
                        <div class="campo">
                            <label for="admin-nome">Nome</label>
                            <input placeholder="Digite seu nome" id="admin-nome" maxlength="150" required>
                        </div>
                        <div class="campo">
                            <label for="admin-email">E-mail para entrar</label>
                            <input placeholder="Digite seu e-mail" id="admin-email" type="email" maxlength="255" autocomplete="email" required>
                        </div>
                        <div class="campo">
                            <label for="admin-senha">Senha (mínimo 8 caracteres)</label>
                            <input placeholder="Digite sua senha" id="admin-senha" type="password" minlength="8" autocomplete="new-password" required>
                        </div>
                        <div class="campo">
                            <label for="admin-chave">Chave de configuração do servidor</label>
                            <input placeholder="Digite a chave de configuração" id="admin-chave" type="password" minlength="32" autocomplete="off" required>
                        </div>
                        <button type="submit" id="admin-botao">Salvar acesso do Administrador</button>
                    </form>

                    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
                    <p class="rodape">
                        <a href="login.html">Voltar ao login</a>
                    </p>
                </main>

            </div>
        </div>
    </div>

    <script>
        const mensagem = document.getElementById('mensagem');

        function configurarFormulario(formId, prefixo, endpoint, rotuloBotao) {
            const form = document.getElementById(formId);
            const botao = document.getElementById(`${prefixo}-botao`);
            form.addEventListener('submit', async event => {
                event.preventDefault();
                mensagem.textContent = '';
                mensagem.className = 'mensagem';
                botao.disabled = true;
                botao.textContent = 'Salvando...';
                try {
                    const resposta = await fetch(`http://localhost:3000/auth/${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            cpf: document.getElementById(`${prefixo}-cpf`).value,
                            nome: document.getElementById(`${prefixo}-nome`).value.trim(),
                            email: document.getElementById(`${prefixo}-email`).value.trim().toLowerCase(),
                            senha: document.getElementById(`${prefixo}-senha`).value,
                            chave: document.getElementById(`${prefixo}-chave`).value
                        })
                    });
                    const dados = await resposta.json().catch(() => ({}));
                    if (!resposta.ok) {
                        const detalhe = Array.isArray(dados.message)
                            ? dados.message.join(' ')
                            : dados.message;
                        throw new Error(detalhe || dados.mensagem || `Erro HTTP ${resposta.status}`);
                    }
                    mensagem.textContent = `${dados.mensagem} Agora você pode entrar com o e-mail e senha informados.`;
                    mensagem.className = 'mensagem sucesso';
                    form.reset();
                } catch (erro) {
                    mensagem.textContent = erro.message || 'Não foi possível salvar o acesso.';
                    mensagem.className = 'mensagem erro';
                } finally {
                    botao.disabled = false;
                    botao.textContent = rotuloBotao;
                }
            });
        }

        configurarFormulario('form-admin', 'admin', 'bootstrap-admin', 'Salvar acesso do Administrador');
    </script>
</body>
</html>
