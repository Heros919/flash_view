<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Configurar acessos</title>
    <link rel="stylesheet" href="./css/cadastroUsuario.css">
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">
</head>

<body>
    <main class="cadastro">
        <header class="cabecalho">
            <h1>Flash View</h1>
            <h2>Cadastro do Administrador</h2>
            <p>Informe os dados para criar ou atualizar o acesso do Administrador.</p>
        </header>

        <form id="form-admin" class="formulario">
            <h3>Administrador</h3>
            <div class="campo">
                <label for="admin-cpf">CPF (11 números)</label>
                <input id="admin-cpf" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" required>
            </div>
            <div class="campo">
                <label for="admin-nome">Nome</label>
                <input id="admin-nome" maxlength="150" required>
            </div>
            <div class="campo">
                <label for="admin-email">E-mail para entrar</label>
                <input id="admin-email" type="email" maxlength="255" autocomplete="email" required>
            </div>
            <div class="campo">
                <label for="admin-senha">Senha (mínimo 8 caracteres)</label>
                <input id="admin-senha" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="campo">
                <label for="admin-chave">Chave de configuração do servidor (mínimo 32 caracteres)</label>
                <input id="admin-chave" type="password" minlength="32" autocomplete="off" required>
            </div>
            <button type="submit" id="admin-botao">Salvar acesso do Administrador</button>
        </form>

        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        <p class="rodape">
            <a href="bootstrap-financeiro.html">Ir para cadastro do Financeiro</a>
            <br>
            <a href="login.html">Voltar ao login</a>
        </p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const mensagem = document.getElementById('mensagem');

        function configurarFormulario(formId, prefixo, endpoint, rotuloBotao) {
            const form = document.getElementById(formId);
            const botao = document.getElementById(`${prefixo}-botao`);
            form.addEventListener('submit', async event => {
                event.preventDefault();
                mensagem.textContent = '';
                mensagem.className = 'mensagem';
                botao.disabled = true;
                botao.textContent = 'Salvando...';
                try {
                    const cpf = document.getElementById(`${prefixo}-cpf`).value.replace(/\D/g, '');
                    const nome = document.getElementById(`${prefixo}-nome`).value.trim();
                    const email = document.getElementById(`${prefixo}-email`).value.trim().toLowerCase();
                    const senha = document.getElementById(`${prefixo}-senha`).value;
                    const chave = document.getElementById(`${prefixo}-chave`).value.trim();

                    if (cpf.length !== 11) {
                        throw new Error('Informe um CPF com 11 números.');
                    }

                    if (!nome) {
                        throw new Error('Informe o nome.');
                    }

                    if (!email) {
                        throw new Error('Informe o e-mail.');
                    }

                    if (senha.length < 8) {
                        throw new Error('A senha deve ter pelo menos 8 caracteres.');
                    }

                    if (chave.length < 32) {
                        throw new Error('A chave de configuração deve ter pelo menos 32 caracteres.');
                    }

                    const resposta = await fetch(`${API_URL}/auth/${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cpf, nome, email, senha, chave })
                    });

                    let dados = {};
                    try {
                        dados = await resposta.json();
                    } catch {
                        dados = {};
                    }

                    if (!resposta.ok) {
                        const detalhe = Array.isArray(dados.message)
                            ? dados.message.join(' ')
                            : dados.message || dados.mensagem;
                        throw new Error(detalhe || `Erro HTTP ${resposta.status}`);
                    }

                    mensagem.textContent = `${dados.mensagem || 'Acesso configurado com sucesso.'} Agora você pode entrar com o e-mail e senha informados.`;
                    mensagem.className = 'mensagem sucesso';
                    form.reset();
                } catch (erro) {
                    const mensagemErro = erro instanceof Error ? erro.message : 'Não foi possível salvar o acesso.';
                    mensagem.textContent = mensagemErro;
                    mensagem.className = 'mensagem erro';
                } finally {
                    botao.disabled = false;
                    botao.textContent = rotuloBotao;
                }
            });
        }

        configurarFormulario('form-admin', 'admin', 'bootstrap-admin', 'Salvar acesso do Administrador');
    </script>
</body>

</html>
