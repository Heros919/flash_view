<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flash View - Novo Bloco</title>
    <link rel="icon" href="assets/logoFlashView.jpeg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-body: #0a111a;
            --bg-sidebar: #0f1722;
            --bg-card: #141d2b;
            --bg-input: #1c2736;
            --border-color: #233142;
            --text-main: #e2e8f0;
            --text-muted: #8b9eb0;
            --brand-yellow: #ffc107;
            --brand-cyan: #00d2ff;
            
            --status-disponivel: #10b981;
            --status-reservado: #eab308;
            --status-vendido: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding-bottom: 3rem;
        }

        .page-title {
            font-family: Georgia, serif;
            font-weight: 700;
            color: #ffffff;
            text-decoration: underline;
            text-decoration-color: var(--brand-yellow);
        }

        hr {
            border-color: var(--border-color);
            opacity: 1;
            margin-bottom: 2rem;
        }

        form#form-bloco {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* CORREÇÃO DO FUNDO BRANCO NOS INPUTS E SELECTS */
        .form-control, .form-select {
            background-color: var(--bg-input) !important;
            border: 1px solid var(--border-color);
            color: #ffffff !important;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        /* CORREÇÃO DA SETINHA DO SELECT (Para ficar visível no escuro) */
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%238b9eb0' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 0.75rem center !important;
            background-size: 16px 12px !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-input) !important;
            border-color: var(--brand-cyan);
            color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
        }

        .form-control::placeholder {
            color: #4a627a;
        }

        /* CORREÇÃO DO FUNDO DAS OPÇÕES DO SELECT */
        .form-select option {
            background-color: var(--bg-body) !important;
            color: #ffffff !important;
        }

        .form-text {
            color: var(--text-muted) !important;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .form-control[type="file"] {
            padding: 0.5rem;
        }

        .form-control[type="file"]::file-selector-button {
            background-color: var(--border-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            transition: all 0.2s;
        }

        .form-control[type="file"]::file-selector-button:hover {
            background-color: var(--brand-cyan);
            color: #000;
        }

        .btn-success {
            background-color: var(--brand-cyan);
            border-color: var(--brand-cyan);
            color: #000;
            font-weight: 600;
            padding: 0.75rem 2rem;
        }

        .btn-success:hover {
            background-color: #00b0d8;
            border-color: #00b0d8;
            color: #000;
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--border-color);
            color: var(--text-muted);
            padding: 0.75rem 2rem;
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
            color: #ffffff;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #75b798;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>

</head>

<body class="container mt-5">

    <div class="d-flex align-items-center gap-3 mb-3">

        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">

            <img src="assets/logoFlashViewRecortada.png" alt="Flash View" style="max-height: 80px; object-fit: contain;">

        </a>

        <h1 class="mb-0 page-title">
            Cadastrar Novo Bloco
        </h1>

    </div>

    <hr>

    <form id="form-bloco" class="row g-3">

        <div class="col-md-6">

            <div id="funcionario-container">
                <label for="funcionarioId" class="form-label stat-label">Funcionário responsável</label>
                <select class="form-select" id="funcionarioId" required>
                    <option value="">Carregando funcionários...</option>
                </select>
                <div id="ajuda-funcionario" class="form-text">
                    Selecione o funcionário responsável.
                </div>
            </div>

            <div id="administrador-container" hidden>
                <label for="administradorId" class="form-label stat-label">ID do Administrador responsável</label>
                <input class="form-control" id="administradorId" readonly>
                <div class="form-text">O cadastro será associado à sua conta.</div>
            </div>

            <div id="cliente-container" hidden>
                <label for="clienteBusca" class="form-label stat-label">Buscar cliente</label>
                <div class="position-relative">
                    <input class="form-control" id="clienteBusca" type="search" autocomplete="off"
                        placeholder="Digite o nome, CPF ou ID do cliente" role="combobox" aria-autocomplete="list"
                        aria-expanded="false" aria-controls="clientes-resultados">
                    <input type="hidden" id="clienteId">
                    <div id="clientes-resultados" class="list-group position-absolute w-100 shadow" role="listbox"
                        hidden style="z-index: 1050;"></div>
                </div>
                <div id="ajuda-cliente" class="form-text">
                    Digite pelo menos 2 caracteres para buscar. IDs também podem ser pesquisados diretamente.
                </div>
                <div id="cliente-selecionado" class="form-text" aria-live="polite"></div>
            </div>

        </div>

        <div class="col-md-6">

            <label for="codigo" class="form-label">
                Código
            </label>

            <input type="text" class="form-control" id="codigo" maxlength="50" placeholder="Ex.: BL001" required>

        </div>

        <div class="col-md-4">
            <label for="numero" class="form-label">Número</label>
            <input type="number" class="form-control" id="numero" min="0" max="99" value="1" required>
        </div>

        <div class="col-md-4">
            <label for="material" class="form-label">Material</label>
            <input type="text" class="form-control" id="material" maxlength="150" placeholder="Ex.: Granito">
        </div>

        <div class="col-md-4">
            <label for="cor" class="form-label">Cor</label>
            <input type="text" class="form-control" id="cor" maxlength="160" placeholder="Ex.: Branco">
        </div>

        <div class="col-md-4">
            <label for="comprimento" class="form-label">Comprimento</label>
            <input type="number" class="form-control" id="comprimento" min="0.01" step="0.01" placeholder="Ex.: 3.20" required>
        </div>

        <div class="col-md-4">
            <label for="largura" class="form-label">Largura</label>
            <input type="number" class="form-control" id="largura" min="0.01" step="0.01" placeholder="Ex.: 1.80" required>
        </div>

        <div class="col-md-4">
            <label for="altura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="altura" min="0.01" step="0.01" placeholder="Ex.: 1.70" required>
        </div>

        <div class="col-md-4">
            <label for="peso" class="form-label">Peso (kg)</label>
            <input type="number" class="form-control" id="peso" min="0.01" step="0.01" placeholder="Ex.: 8500">
        </div>

        <div class="col-md-4">
            <label for="mes" class="form-label">Mês</label>
            <select class="form-select" id="mes" required>
                <option value="">Selecione</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
        </div>

        <div class="col-md-4">
            <label for="ano" class="form-label">Ano</label>
            <input type="number" class="form-control" id="ano" min="2000" value="2026" required>
        </div>

        <div class="col-md-4">
            <label for="frente" class="form-label">Frente</label>
            <select class="form-select" id="frente" required>
                <option value="">Selecione</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="BARRAGEM">BARRAGEM</option>
                <option value="BARREIRO">BARREIRO</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="imagem" class="form-label img-blocotxt">
                Imagens do bloco (até 5)
            </label>
            <input type="file" class="form-control" id="imagem" name="imagens" accept="image/*" multiple>
        </div>

        <div class="col-12">
            <div id="contador-imagens" class="form-text">0/5 imagens</div>
            <div id="galeria-imagens" class="d-flex flex-wrap gap-3"></div>
        </div>

        <div class="col-12">
            <div id="mensagem" class="alert d-none" role="alert">
            </div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" id="btn-salvar" class="btn btn-success">
                Salvar Bloco
            </button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>

    <script src="js/api.js"></script>
    <script src="js/multiplas-imagens.js"></script>

    <script>
        const formulario = document.getElementById('form-bloco');
        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('btn-salvar');
        const selectFuncionario = document.getElementById('funcionarioId');
        const campoClienteId = document.getElementById('clienteId');
        const buscaCliente = document.getElementById('clienteBusca');
        const resultadosClientes = document.getElementById('clientes-resultados');
        const contaLogada = JSON.parse(localStorage.getItem('usuario') || 'null');
        let temporizadorBuscaCliente;
        let versaoBuscaCliente = 0;
        const galeriaImagens = window.criarGaleriaImagens({
            recurso: 'blocos',
            input: document.getElementById('imagem'),
            galeria: document.getElementById('galeria-imagens'),
            contador: document.getElementById('contador-imagens'),
            aoErro: (texto) => mostrarMensagem(texto, 'danger'),
        });

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = `alert alert-${tipo}`;
        }

        function esconderMensagem() {
            mensagem.className = 'alert d-none';
            mensagem.textContent = '';
        }

        function fecharResultadosClientes() {
            resultadosClientes.hidden = true;
            buscaCliente.setAttribute('aria-expanded', 'false');
        }

        function mostrarEstadoBuscaCliente(texto) {
            const estado = document.createElement('div');
            estado.className = 'list-group-item text-muted';
            estado.textContent = texto;
            resultadosClientes.replaceChildren(estado);
            resultadosClientes.hidden = false;
            buscaCliente.setAttribute('aria-expanded', 'true');
        }

        function pesquisarClientes() {
            clearTimeout(temporizadorBuscaCliente);
            campoClienteId.value = '';
            document.getElementById('cliente-selecionado').textContent = '';

            const busca = buscaCliente.value.trim();
            const buscaPorId = /^\d+$/.test(busca);
            const versaoAtual = ++versaoBuscaCliente;

            if (busca.length < 2 && !buscaPorId) {
                resultadosClientes.replaceChildren();
                fecharResultadosClientes();
                return;
            }

            mostrarEstadoBuscaCliente('Buscando clientes...');
            temporizadorBuscaCliente = setTimeout(async () => {
                try {
                    const clientes = await api(
                        `/cliente/buscar?busca=${encodeURIComponent(busca)}`
                    );
                    if (
                        versaoAtual !== versaoBuscaCliente ||
                        busca !== buscaCliente.value.trim()
                    ) {
                        return;
                    }
                    if (!Array.isArray(clientes)) {
                        throw new Error('A API retornou uma lista de clientes inválida.');
                    }

                    resultadosClientes.replaceChildren();
                    if (clientes.length === 0) {
                        mostrarEstadoBuscaCliente('Nenhum cliente encontrado.');
                        return;
                    }

                    clientes.forEach((cliente) => {
                        const opcao = document.createElement('button');
                        opcao.type = 'button';
                        opcao.className = 'list-group-item list-group-item-action';
                        opcao.setAttribute('role', 'option');
                        opcao.setAttribute('aria-selected', 'false');
                        opcao.textContent = `${cliente.nome} — ID ${cliente.id}`;
                        opcao.addEventListener('click', () => {
                            campoClienteId.value = String(cliente.id);
                            buscaCliente.value = `${cliente.nome} — ID ${cliente.id}`;
                            document.getElementById('cliente-selecionado').textContent =
                                `Cliente selecionado: ${cliente.nome} (ID ${cliente.id}).`;
                            versaoBuscaCliente += 1;
                            resultadosClientes.replaceChildren();
                            fecharResultadosClientes();
                        });
                        resultadosClientes.appendChild(opcao);
                    });
                    resultadosClientes.hidden = false;
                    buscaCliente.setAttribute('aria-expanded', 'true');
                } catch (error) {
                    if (versaoAtual !== versaoBuscaCliente) {
                        return;
                    }
                    mostrarEstadoBuscaCliente('Erro ao buscar clientes.');
                    mostrarMensagem(
                        `Não foi possível buscar os clientes: ${error.message}`,
                        'danger'
                    );
                }
            }, 250);
        }

        buscaCliente.addEventListener('input', pesquisarClientes);
        buscaCliente.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                fecharResultadosClientes();
            }
        });

        async function carregarFuncionariosResponsaveis() {
            const ajudaFuncionario = document.getElementById('ajuda-funcionario');
            if (contaLogada?.papel === 'FUNCIONARIO') {
                const opcao = document.createElement('option');
                opcao.value = String(contaLogada.id);
                opcao.textContent = `${contaLogada.nome} — ${contaLogada.id}`;
                selectFuncionario.replaceChildren(opcao);
                selectFuncionario.disabled = true;
                ajudaFuncionario.textContent =
                    'Funcionário responsável preenchido automaticamente pela sua conta.';
                document.getElementById('cliente-container').hidden = false;
                return;
            }

            if (contaLogada?.papel === 'ADMINISTRADOR') {
                document.getElementById('funcionario-container').hidden = true;
                document.getElementById('administrador-container').hidden = false;
                document.getElementById('cliente-container').hidden = false;
                document.getElementById('administradorId').value = contaLogada.id;
                selectFuncionario.required = false;
                return;
            }

            try {
                const funcionarios = await api('/auth/funcionarios-responsaveis');
                if (!Array.isArray(funcionarios)) {
                    throw new Error('A API retornou uma lista de funcionários inválida.');
                }

                selectFuncionario.innerHTML =
                    '<option value="">Selecione o funcionário responsável</option>';
                funcionarios.forEach((funcionario) => {
                    const opcao = document.createElement('option');
                    opcao.value = funcionario.id;
                    opcao.textContent = `${funcionario.nome} — ${funcionario.id}`;
                    selectFuncionario.appendChild(opcao);
                });

                if (funcionarios.length === 0) {
                    selectFuncionario.innerHTML =
                        '<option value="">Nenhum funcionário cadastrado</option>';
                    selectFuncionario.disabled = true;
                    ajudaFuncionario.textContent =
                        'Cadastre um funcionário antes de criar o bloco.';
                }
            } catch (error) {
                selectFuncionario.innerHTML =
                    '<option value="">Erro ao carregar funcionários</option>';
                selectFuncionario.disabled = true;
                mostrarMensagem(
                    `Não foi possível carregar os funcionários: ${error.message}`,
                    'danger'
                );
            }
        }

        carregarFuncionariosResponsaveis();

        formulario.addEventListener('submit', async (event) => {
            event.preventDefault();
            esconderMensagem();

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            let blocoCriado = false;

            try {
                const ehAdministrador = contaLogada?.papel === 'ADMINISTRADOR';
                const ehFuncionario = contaLogada?.papel === 'FUNCIONARIO';
                const funcionarioId = selectFuncionario.value.trim();
                if (!ehAdministrador && !funcionarioId) {
                    mostrarMensagem(
                        'Selecione um funcionário responsável válido.',
                        'danger'
                    );
                    return;
                }

                const codigo =
                    document.getElementById('codigo').value.trim();

                const numero =
                    Number(document.getElementById('numero').value);

                const material =
                    document.getElementById('material').value.trim();

                const cor =
                    document.getElementById('cor').value.trim();

                const comprimento =
                    Number(document.getElementById('comprimento').value);

                const largura =
                    Number(document.getElementById('largura').value);

                const altura =
                    Number(document.getElementById('altura').value);

                const pesoCampo =
                    document.getElementById('peso').value;

                const mes =
                    Number(document.getElementById('mes').value);

                const ano =
                    Number(document.getElementById('ano').value);

                const frente =
                    document.getElementById('frente').value;


                const novoBloco = {
                    codigo,
                    numero,
                    altura,
                    largura,
                    comprimento,
                    mes,
                    ano,
                    frente
                };

                if (ehAdministrador || ehFuncionario) {
                    if (!campoClienteId.value) {
                        mostrarMensagem(
                            'Busque e selecione um cliente antes de salvar.',
                            'danger'
                        );
                        return;
                    }
                    novoBloco.clienteId = Number(campoClienteId.value);
                }

                if (!ehAdministrador) {
                    novoBloco.funcionarioId = funcionarioId;
                }

                if (material) {
                    novoBloco.material = material;
                }

                if (cor) {
                    novoBloco.cor = cor;
                }

                if (pesoCampo !== '') {
                    novoBloco.peso = Number(pesoCampo);
                }

                console.log('Cadastrando bloco:', novoBloco);

                const resposta = await api('/blocos', {
                    method: 'POST',
                    body: JSON.stringify(novoBloco)
                });

                blocoCriado = true;

                if (!resposta || !resposta.id) {
                    throw new Error(
                        'O bloco foi cadastrado, mas a API não retornou seu ID. Não envie o formulário novamente.'
                    );
                }

                const possuiImagens = galeriaImagens.selecionadas.length > 0;

                if (possuiImagens) {
                    botaoSalvar.textContent = 'Enviando imagens...';
                    await galeriaImagens.enviar(resposta.id);
                }

                mostrarMensagem(
                    possuiImagens
                        ? 'Bloco e imagens cadastrados com sucesso!'
                        : 'Bloco cadastrado com sucesso!',
                    'success'
                );

                formulario.reset();

                setTimeout(() => {
                    window.location.href = 'historicoBlocosChapas.html';
                }, 1200);

            } catch (error) {
                console.error('Erro ao cadastrar bloco:', error);

                mostrarMensagem(
                    error.message || 'Erro ao cadastrar o bloco.',
                    'danger'
                );


                if (blocoCriado) {
                    botaoSalvar.disabled = true;
                    botaoSalvar.textContent = 'Bloco já cadastrado';
                    return;
                }

            } finally {
                if (!blocoCriado) {
                    botaoSalvar.disabled = false;
                    botaoSalvar.textContent = 'Salvar Bloco';
                }
            }
        });
    </script>

</body>

</html>
