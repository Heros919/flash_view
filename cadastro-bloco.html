<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flash View - Novo Bloco</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-5">

    <div class="d-flex align-items-center gap-3 mb-3">

        <a
            href="dashboard.html"
            aria-label="Voltar para dashboard"
            class="d-inline-flex align-items-center">

            <img
                src="assets/logo.ico"
                alt="Flash View"
                style="width: 48px; height: 48px; object-fit: contain;">

        </a>

        <h1 class="mb-0">
            Cadastrar Novo Bloco
        </h1>

    </div>

    <hr>


    <form id="form-bloco" class="row g-3">

        <!-- FUNCIONÁRIO -->

        <div class="col-md-6">

            <label
                for="funcionarioId"
                class="form-label">

                ID do Funcionário
            </label>

            <input
                type="text"
                class="form-control"
                id="funcionarioId"
                placeholder="ID do funcionário"
                required>

            <div class="form-text">
                Informe o ID real do funcionário autenticado.
            </div>

        </div>


        <!-- CÓDIGO -->

        <div class="col-md-6">

            <label
                for="codigo"
                class="form-label">

                Código
            </label>

            <input
                type="text"
                class="form-control"
                id="codigo"
                maxlength="50"
                placeholder="Ex.: BL001"
                required>

        </div>


        <!-- NÚMERO -->

        <div class="col-md-4">

            <label
                for="numero"
                class="form-label">

                Número
            </label>

            <input
                type="number"
                class="form-control"
                id="numero"
                min="0"
                max="99"
                value="1"
                required>

        </div>


        <!-- MATERIAL -->

        <div class="col-md-4">

            <label
                for="material"
                class="form-label">

                Material
            </label>

            <input
                type="text"
                class="form-control"
                id="material"
                maxlength="150"
                placeholder="Ex.: Granito">

        </div>


        <!-- COR -->

        <div class="col-md-4">

            <label
                for="cor"
                class="form-label">

                Cor
            </label>

            <input
                type="text"
                class="form-control"
                id="cor"
                maxlength="160"
                placeholder="Ex.: Branco">

        </div>


        <!-- COMPRIMENTO -->

        <div class="col-md-4">

            <label
                for="comprimento"
                class="form-label">

                Comprimento
            </label>

            <input
                type="number"
                class="form-control"
                id="comprimento"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 3.20"
                required>

        </div>


        <!-- LARGURA -->

        <div class="col-md-4">

            <label
                for="largura"
                class="form-label">

                Largura
            </label>

            <input
                type="number"
                class="form-control"
                id="largura"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 1.80"
                required>

        </div>


        <!-- ALTURA -->

        <div class="col-md-4">

            <label
                for="altura"
                class="form-label">

                Altura
            </label>

            <input
                type="number"
                class="form-control"
                id="altura"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 1.70"
                required>

        </div>


        <!-- PESO -->

        <div class="col-md-4">

            <label
                for="peso"
                class="form-label">

                Peso (kg)
            </label>

            <input
                type="number"
                class="form-control"
                id="peso"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 8500">

        </div>


        <!-- MÊS -->

        <div class="col-md-4">

            <label
                for="mes"
                class="form-label">

                Mês
            </label>

            <select
                class="form-select"
                id="mes"
                required>

                <option value="">
                    Selecione
                </option>

                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>

            </select>

        </div>


        <!-- ANO -->

        <div class="col-md-4">

            <label
                for="ano"
                class="form-label">

                Ano
            </label>

            <input
                type="number"
                class="form-control"
                id="ano"
                min="2000"
                value="2026"
                required>

        </div>


        <!-- FRENTE -->

        <div class="col-md-4">

            <label
                for="frente"
                class="form-label">

                Frente
            </label>

            <select
                class="form-select"
                id="frente"
                required>

                <option value="">
                    Selecione
                </option>

                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="BARRAGEM">BARRAGEM</option>
                <option value="BARREIRO">BARREIRO</option>

            </select>

        </div>


        <!-- IMAGEM -->

        <div class="col-md-6">

            <label
                for="imagem"
                class="form-label">

                Imagem do bloco
            </label>

            <input
                type="file"
                class="form-control"
                id="imagem"
                accept="image/*">

        </div>


        <div class="col-12">

            <img
                id="preview-imagem"
                src=""
                alt="Prévia da imagem do bloco"
                class="img-fluid rounded border d-none"
                style="max-height: 220px;">

        </div>


        <!-- AVISO -->

        <div class="col-12">

            <div
                id="mensagem"
                class="alert d-none"
                role="alert">
            </div>

        </div>


        <!-- BOTÕES -->

        <div class="col-12 mt-4">

            <button
                type="submit"
                id="btn-salvar"
                class="btn btn-success">

                Salvar Bloco

            </button>

            <a
                href="historicoBlocosChapas.html"
                class="btn btn-secondary">

                Cancelar

            </a>

        </div>

    </form>


    <script src="js/api.js"></script>


    <script>

        const formulario =
            document.getElementById('form-bloco');

        const mensagem =
            document.getElementById('mensagem');

        const botaoSalvar =
            document.getElementById('btn-salvar');

        const inputImagem =
            document.getElementById('imagem');

        const previewImagem =
            document.getElementById('preview-imagem');

        let imagemSelecionada = '';


        inputImagem.addEventListener('change', () => {

            const arquivo = inputImagem.files[0];

            if (!arquivo) {
                imagemSelecionada = '';
                previewImagem.src = '';
                previewImagem.classList.add('d-none');
                return;
            }

            const leitor = new FileReader();

            leitor.onload = () => {

                if (typeof leitor.result !== 'string') {
                    mostrarMensagem(
                        'Não foi possível carregar a imagem selecionada.',
                        'danger'
                    );
                    return;
                }

                imagemSelecionada = leitor.result;
                previewImagem.src = imagemSelecionada;
                previewImagem.classList.remove('d-none');
            };

            leitor.onerror = () => {
                mostrarMensagem(
                    'Não foi possível carregar a imagem selecionada.',
                    'danger'
                );
            };

            leitor.readAsDataURL(arquivo);
        });


        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;

            mensagem.className =
                `alert alert-${tipo}`;

        }


        function esconderMensagem() {

            mensagem.className =
                'alert d-none';

            mensagem.textContent = '';

        }


        formulario.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();

                esconderMensagem();

                botaoSalvar.disabled = true;

                botaoSalvar.textContent =
                    'Salvando...';


                try {

                    const funcionarioId =
                        document
                            .getElementById('funcionarioId')
                            .value
                            .trim();


                    const codigo =
                        document
                            .getElementById('codigo')
                            .value
                            .trim();


                    const numero =
                        Number(
                            document
                                .getElementById('numero')
                                .value
                        );


                    const material =
                        document
                            .getElementById('material')
                            .value
                            .trim();


                    const cor =
                        document
                            .getElementById('cor')
                            .value
                            .trim();


                    const comprimento =
                        Number(
                            document
                                .getElementById('comprimento')
                                .value
                        );


                    const largura =
                        Number(
                            document
                                .getElementById('largura')
                                .value
                        );


                    const altura =
                        Number(
                            document
                                .getElementById('altura')
                                .value
                        );


                    const pesoCampo =
                        document
                            .getElementById('peso')
                            .value;


                    const mes =
                        Number(
                            document
                                .getElementById('mes')
                                .value
                        );


                    const ano =
                        Number(
                            document
                                .getElementById('ano')
                                .value
                        );


                    const frente =
                        document
                            .getElementById('frente')
                            .value;


                    const novoBloco = {

                        funcionarioId,

                        codigo,

                        numero,

                        material: material || undefined,

                        cor: cor || undefined,

                        altura,

                        largura,

                        comprimento,

                        peso:
                            pesoCampo
                                ? Number(pesoCampo)
                                : undefined,

                        mes,

                        ano,

                        frente,

                        imagem: imagemSelecionada

                    };


                    console.log(
                        'Enviando bloco:',
                        novoBloco
                    );


                    await api(
                        '/blocos',
                        {
                            method: 'POST',
                            body:
                                JSON.stringify(
                                    novoBloco
                                )
                        }
                    );


                    mostrarMensagem(
                        'Bloco cadastrado com sucesso!',
                        'success'
                    );


                    setTimeout(() => {

                        window.location.href =
                            'historicoBlocosChapas.html';

                    }, 1000);


                } catch (error) {

                    console.error(
                        'Erro ao cadastrar bloco:',
                        error
                    );


                    mostrarMensagem(
                        error.message ||
                        'Erro ao cadastrar o bloco.',
                        'danger'
                    );


                } finally {

                    botaoSalvar.disabled =
                        false;

                    botaoSalvar.textContent =
                        'Salvar Bloco';

                }

            }
        );

    </script>

</body>

</html>
