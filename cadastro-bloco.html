<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flash View - Novo Bloco</title>
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-dark-blue: #061426;
            --brand-yellow: #FFD700;
            --brand-blue: #00B0FF;
            --input-bg: #0d233a;
            --input-border: #1c3a5a;
            --text-muted: #8b9eb0;
            --bg-card: #0a111a;
        }

        body {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding-bottom: 3rem;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 0;
        }

        hr {
            border-color: var(--input-border);
            opacity: 1;
            margin-bottom: 2rem;
        }

        form#form-bloco {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--brand-blue);
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 176, 255, 0.15);
        }

        .form-control::placeholder {
            color: #4a627a;
        }

        .form-select option {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
        }

        .form-text {
            color: var(--text-muted) !important;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .form-control[type="file"] {
            padding: 0.5rem;
        }

        .form-control[type="file"]::file-selector-button {
            background-color: var(--input-border);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            transition: all 0.2s;
        }

        .form-control[type="file"]::file-selector-button:hover {
            background-color: var(--brand-blue);
            color: #000;
        }

        .btn-success {
            background-color: var(--brand-blue);
            border-color: var(--brand-blue);
            color: #000;
            font-weight: 600;
            padding: 0.75rem 2rem;
        }

        .btn-success:hover {
            background-color: #0099cc;
            border-color: #0099cc;
            color: #000;
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--input-border);
            color: var(--text-muted);
            padding: 0.75rem 2rem;
        }

        .btn-secondary:hover {
            background-color: var(--input-border);
            color: #ffffff;
        }

        .alert-success {
            background-color: rgba(25, 135, 84, 0.1);
            color: #75b798;
            border: 1px solid rgba(25, 135, 84, 0.3);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>

<body class="container mt-5">

    <div class="d-flex align-items-center gap-3 mb-3">

        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">

            <img src="assets/logoFlashViewRecortada.png" alt="Flash View" style="width: 100px; height: 60px; object-fit: contain;">

        </a>

        <h1 class="mb-0">
            Cadastrar Novo Bloco
        </h1>

    </div>

    <hr>


    <form id="form-bloco" class="row g-3">

        <div class="col-md-6">

            <label for="funcionarioId" class="form-label">

                ID do Funcionário
            </label>

            <input type="text" class="form-control" id="funcionarioId" placeholder="ID do funcionário" required>

            <div id="ajuda-funcionario" class="form-text">
                Funcionário: ID preenchido pelo login. Financeiro/Administrador: informe o ID do funcionário responsável
                pelo bloco.
            </div>

        </div>


        <div class="col-md-6">

            <label for="codigo" class="form-label">

                Código
            </label>

            <input type="text" class="form-control" id="codigo" maxlength="50" placeholder="Ex.: BL001" required>

        </div>


        <div class="col-md-4">

            <label for="numero" class="form-label">

                Número
            </label>

            <input type="number" class="form-control" id="numero" min="0" max="99" value="1" required>

        </div>


        <div class="col-md-4">

            <label for="material" class="form-label">

                Material
            </label>

            <input type="text" class="form-control" id="material" maxlength="150" placeholder="Ex.: Granito">

        </div>


        <div class="col-md-4">

            <label for="cor" class="form-label">

                Cor
            </label>

            <input type="text" class="form-control" id="cor" maxlength="160" placeholder="Ex.: Branco">

        </div>


        <div class="col-md-4">

            <label for="comprimento" class="form-label">

                Comprimento
            </label>

            <input type="number" class="form-control" id="comprimento" min="0.01" step="0.01" placeholder="Ex.: 3.20"
                required>

        </div>


        <div class="col-md-4">

            <label for="largura" class="form-label">

                Largura
            </label>

            <input type="number" class="form-control" id="largura" min="0.01" step="0.01" placeholder="Ex.: 1.80"
                required>

        </div>


        <div class="col-md-4">

            <label for="altura" class="form-label">

                Altura
            </label>

            <input type="number" class="form-control" id="altura" min="0.01" step="0.01" placeholder="Ex.: 1.70"
                required>

        </div>


        <div class="col-md-4">

            <label for="peso" class="form-label">

                Peso (kg)
            </label>

            <input type="number" class="form-control" id="peso" min="0.01" step="0.01" placeholder="Ex.: 8500">

        </div>


        <div class="col-md-4">

            <label for="mes" class="form-label">

                Mês
            </label>

            <select class="form-select" id="mes" required>

                <option value="">
                    Selecione
                </option>

                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>

            </select>

        </div>


        <div class="col-md-4">

            <label for="ano" class="form-label">

                Ano
            </label>

            <input type="number" class="form-control" id="ano" min="2000" value="2026" required>

        </div>


        <div class="col-md-4">

            <label for="frente" class="form-label">

                Frente
            </label>

            <select class="form-select" id="frente" required>

                <option value="">
                    Selecione
                </option>

                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="BARRAGEM">BARRAGEM</option>
                <option value="BARREIRO">BARREIRO</option>

            </select>

        </div>


        <div class="col-md-6">

            <label for="imagem" class="form-label">

                Imagens do bloco (até 5)
            </label>

            <input type="file" class="form-control" id="imagem" name="imagens" accept="image/*" multiple>

        </div>


        <div class="col-12">

            <div id="contador-imagens" class="form-text">0/5 imagens</div>
            <div id="galeria-imagens" class="d-flex flex-wrap gap-3"></div>

        </div>


        <div class="col-12">

            <div id="mensagem" class="alert d-none" role="alert">
            </div>

        </div>


        <div class="col-12 mt-4">

            <button type="submit" id="btn-salvar" class="btn btn-success">

                Salvar Bloco

            </button>

            <a href="historicoBlocosChapas.html" class="btn btn-secondary">

                Cancelar

            </a>

        </div>

    </form>


    <script src="js/api.js"></script>
    <script src="js/multiplas-imagens.js"></script>


    <script>

        const formulario = document.getElementById('form-bloco');
        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('btn-salvar');
        const contaLogada = JSON.parse(localStorage.getItem('usuario') || 'null');
        if (contaLogada?.papel === 'FUNCIONARIO') {
            document.getElementById('funcionarioId').value = contaLogada.id;
            document.getElementById('funcionarioId').readOnly = true;
            document.getElementById('ajuda-funcionario').textContent =
                'ID do funcionário preenchido automaticamente pela sua conta.';
        }
        const galeriaImagens = window.criarGaleriaImagens({
            recurso: 'blocos',
            input: document.getElementById('imagem'),
            galeria: document.getElementById('galeria-imagens'),
            contador: document.getElementById('contador-imagens'),
            aoErro: (texto) => mostrarMensagem(texto, 'danger'),
        });

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = `alert alert-${tipo}`;
        }

        function esconderMensagem() {
            mensagem.className = 'alert d-none';
            mensagem.textContent = '';
        }

        formulario.addEventListener('submit', async (event) => {
            event.preventDefault();
            esconderMensagem();

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            let blocoCriado = false;

            try {
                const funcionarioId =
                    document.getElementById('funcionarioId').value.trim();

                const codigo =
                    document.getElementById('codigo').value.trim();

                const numero =
                    Number(document.getElementById('numero').value);

                const material =
                    document.getElementById('material').value.trim();

                const cor =
                    document.getElementById('cor').value.trim();

                const comprimento =
                    Number(document.getElementById('comprimento').value);

                const largura =
                    Number(document.getElementById('largura').value);

                const altura =
                    Number(document.getElementById('altura').value);

                const pesoCampo =
                    document.getElementById('peso').value;

                const mes =
                    Number(document.getElementById('mes').value);

                const ano =
                    Number(document.getElementById('ano').value);

                const frente =
                    document.getElementById('frente').value;


                const novoBloco = {
                    funcionarioId,
                    codigo,
                    numero,
                    altura,
                    largura,
                    comprimento,
                    mes,
                    ano,
                    frente
                };

                if (material) {
                    novoBloco.material = material;
                }

                if (cor) {
                    novoBloco.cor = cor;
                }

                if (pesoCampo !== '') {
                    novoBloco.peso = Number(pesoCampo);
                }

                console.log('Cadastrando bloco:', novoBloco);

                const resposta = await api('/blocos', {
                    method: 'POST',
                    body: JSON.stringify(novoBloco)
                });

                blocoCriado = true;

                if (!resposta || !resposta.id) {
                    throw new Error(
                        'O bloco foi cadastrado, mas a API não retornou seu ID. Não envie o formulário novamente.'
                    );
                }

                const possuiImagens = galeriaImagens.selecionadas.length > 0;

                if (possuiImagens) {
                    botaoSalvar.textContent = 'Enviando imagens...';
                    await galeriaImagens.enviar(resposta.id);
                }

                mostrarMensagem(
                    possuiImagens
                        ? 'Bloco e imagens cadastrados com sucesso!'
                        : 'Bloco cadastrado com sucesso!',
                    'success'
                );

                formulario.reset();

                setTimeout(() => {
                    window.location.href = 'historicoBlocosChapas.html';
                }, 1200);

            } catch (error) {
                console.error('Erro ao cadastrar bloco:', error);

                mostrarMensagem(
                    error.message || 'Erro ao cadastrar o bloco.',
                    'danger'
                );


                if (blocoCriado) {
                    botaoSalvar.disabled = true;
                    botaoSalvar.textContent = 'Bloco já cadastrado';
                    return;
                }

            } finally {
                if (!blocoCriado) {
                    botaoSalvar.disabled = false;
                    botaoSalvar.textContent = 'Salvar Bloco';
                }
            }
        });
    </script>

</body>

</html>
