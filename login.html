<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">

    <style>
        :root {
            --bg-dark-blue: #061426;
            --brand-yellow: #FFD700;
            --brand-blue: #00B0FF;
            --input-bg: #0d233a;
            --input-border: #1c3a5a;
            --text-muted: #8b9eb0;
        }

        body {
            background-color: var(--bg-dark-blue);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .bg-image-side {
            background-image: linear-gradient(to bottom, rgba(6, 20, 38, 0.7), rgba(6, 20, 38, 1)), url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .login-form-container {
            max-width: 420px;
            width: 100%;
            padding: 2rem;
        }

        .logo-text {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-subtitle {
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        .perfil-selector .btn {
            border-color: var(--input-border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .perfil-selector .btn.active {
            border-color: var(--brand-yellow);
            color: var(--brand-yellow);
            background-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border);
            color: #ffffff !important;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background-color: var(--input-bg) !important;
            border-color: var(--brand-blue);
            color: #ffffff !important;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #4a627a;
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px var(--input-bg) inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .form-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .btn-split-container {
            display: flex;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .btn-split-container:hover {
            opacity: 0.9;
        }
        .btn-split-yellow {
            background-color: var(--brand-yellow);
            color: #000;
            border: none;
            font-weight: 600;
            padding: 0.75rem;
            flex: 1;
        }
        .btn-split-blue {
            background-color: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .footer-link:hover {
            color: var(--brand-blue);
        }

        .mensagem {
            font-size: 0.85rem;
            padding: 0.5rem;
            border-radius: 4px;
            display: none;
        }
        .mensagem.erro {
            display: block;
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        .mensagem.sucesso {
            display: block;
            background-color: rgba(25, 135, 84, 0.1);
            color: #75b798;
            border: 1px solid rgba(25, 135, 84, 0.3);
        }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            
            <div class="col-md-7 d-none d-md-flex flex-column justify-content-between bg-image-side p-5">
                <div class="mt-5">
                    <p class="text-warning fw-bold text-uppercase mb-0" style="letter-spacing: 2px; font-size: 0.8rem;">
                        — Controle Operacional Inteligente
                    </p>
                </div>
                <div class="mb-5">
                    <h1 class="display-3 fw-bold" style="line-height: 1.1;">
                        Gestão de blocos<br>
                        <span class="text-info" style="color: var(--brand-blue) !important;">e chapas</span>
                    </h1>
                </div>
            </div>

            <div class="col-md-5 d-flex align-items-center justify-content-center">
                <div class="login-form-container">
                    
                    <div class="mb-5">
                        <div class="logo-text">
                            <img src="assets/logoFlashViewRecortada.png" alt="Logo" class="img-fluid" style="max-height: 100px;">
                            FLASH<span style="color: var(--brand-yellow);">VIEW</span>
                        </div>
                        <span class="logo-subtitle">Visualização Rápida e Precisa</span>
                    </div>

                    <h2 class="fw-bold mb-1" style="font-family: serif;">Entrar</h2>

                    <div class="mb-4">
                        <label class="form-label d-block mb-2">Perfil de Acesso</label>
                        <div class="d-flex gap-2 perfil-selector" id="perfilSelector">
                            <button type="button" class="btn btn-outline-secondary flex-fill">Administrador</button>
                            <button type="button" class="btn btn-outline-secondary flex-fill">Financeiro</button>
                            <button type="button" class="btn btn-outline-secondary flex-fill active">Funcionário</button>
                        </div>
                    </div>

                    <div id="mensagem" class="mensagem mb-3" role="status" aria-live="polite"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" autocomplete="email" required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        </div>

                        <button type="submit" id="btnLogin" class="btn-split-container">
                            <span class="btn-split-yellow">Entrar</span>
                            <span class="btn-split-blue"><i class="bi bi-arrow-right"></i></span>
                        </button>
                    </form>

                    <div class="mt-4 text-center">
                        <a href="cadastro-usuario.html" class="footer-link">Não tem conta? <span class="text-info" style="color: var(--brand-blue) !important;">Criar conta</span></a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="./js/api.js"></script>
    
    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const mensagem = document.getElementById('mensagem');

        const botoesPerfil = document.querySelectorAll('#perfilSelector .btn');
        botoesPerfil.forEach(btn => {
            btn.addEventListener('click', () => {
                // Lógica original de ativar o botão
                botoesPerfil.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Redirecionamento baseado no perfil clicado
                const perfil = btn.textContent.trim().toLowerCase();
                if (perfil === 'administrador') {
                    window.location.href = 'bootstrap-admin.html';
                } else if (perfil === 'financeiro') {
                    window.location.href = 'bootstrap-financeiro.html';
                }
            });
        });

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;
        }

        function limparMensagem() {
            mensagem.textContent = '';
            mensagem.className = 'mensagem';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            limparMensagem();

            const email = emailInput.value.trim().toLowerCase();
            const senha = senhaInput.value;

            if (!email || !senha) {
                mostrarMensagem('Informe o e-mail e a senha.', 'erro');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.style.opacity = '0.7';
            btnLogin.querySelector('.btn-split-yellow').textContent = 'Entrando...';

            try {
                const resposta = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, senha })
                });

                console.log('Resposta do login:', resposta);

                const token = resposta.acesso || resposta.access_token;

                if (!token) {
                    throw new Error('O servidor não retornou o token de acesso.');
                }

                localStorage.setItem('token', token);

                const usuario = resposta.usuario || resposta.funcionario;
                if (usuario) {
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                    localStorage.setItem('usuarioId', String(usuario.id));
                }

                mostrarMensagem('Login realizado com sucesso!', 'sucesso');

                window.setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (erro) {
                console.error('Erro ao fazer login:', erro);

                mostrarMensagem(
                    erro.message || 'Não foi possível realizar o login.',
                    'erro'
                );

                btnLogin.disabled = false;
                btnLogin.style.opacity = '1';
                btnLogin.querySelector('.btn-split-yellow').textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
