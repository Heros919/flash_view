<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Blocos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <div class="">
        <h1>Lista de Blocos</h1>
        <h2>Quantidade total de blocos: <span id="quantidade-blocos">0</span></h2>
        <a href="cadastro-bloco.html" class="">Novo Bloco</a>
            <table id="tabela-blocos" class="">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Material</th>
                        <th>Cor</th>
                        <th>Dimensões (C x L x A)</th>
                        <th>Peso (kg)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-blocos">
                    <tr>
                        <td colspan="6">Carregando...</td>
                    </tr>
                </tbody>
            </table>
    </div>







    <script>
        const API_URL = 'http://localhost:3000';

        async function carregarBlocos() {
            const tbody = document.getElementById('tabela-blocos');
            tbody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/blocos`);
                const blocos = await response.json();

                tbody.innerHTML = ''; // Limpa

                if (blocos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Nenhum bloco cadastrado.</td></tr>';
                    return;
                }

                blocos.forEach(bloco => {
                    const dimensoes = `${bloco.comprimento} x ${bloco.largura} x ${bloco.altura}`;
                    tbody.innerHTML += `
                        <tr>
                            <td>${bloco.codigo}</td>
                            <td>${bloco.material}</td>
                            <td>${bloco.cor}</td>
                            <td>${bloco.dimensoes}</td>
                            <td>${bloco.peso} kg</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="excluirBloco(${bloco.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error('Erro:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="text-danger">Erro ao carregar dados.</td></tr>';
            }
        }

        async function excluirBloco(id) {
            if (!confirm('Deseja realmente excluir este bloco?')) return;

            try {
                const response = await fetch(`${API_URL}/blocos/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Bloco excluído com sucesso!');
                    carregarBlocos(); // Recarrega a tabela
                } else {
                    alert('Erro ao excluir o bloco.');
                }
            } catch (error) {
                console.error('Erro ao excluir:', error);
                alert('Erro de conexão com o servidor.');
            }
        }

        carregarBlocos();
    </script>
</body>

</html>
