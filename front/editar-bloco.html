<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash View - Editar Bloco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="dashboard.html" aria-label="Voltar para dashboard" class="d-inline-flex align-items-center">
            <img src="assets/logo.ico" alt="Flash View" style="width: 48px; height: 48px; object-fit: contain;">
        </a>
        <h1 class="mb-0">Editar Bloco</h1>
    </div>
    <hr>

    <form id="form-editar-bloco" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Material</label>
            <input type="text" class="form-control" id="material" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Cor</label>
            <input type="text" class="form-control" id="cor" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Comprimento (cm)</label>
            <input type="number" class="form-control" id="comprimento" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Largura (cm)</label>
            <input type="number" class="form-control" id="largura" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Altura (cm)</label>
            <input type="number" class="form-control" id="altura" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Peso (kg)</label>
            <input type="number" class="form-control" id="peso" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Imagem do bloco</label>
            <input type="file" class="form-control" id="imagem" accept="image/*">
        </div>

        <div class="col-12">
            <img id="preview-imagem" src="" alt="Imagem do bloco" class="img-fluid rounded border d-none" style="max-height: 220px;">
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="historicoBlocosChapas.html" class="btn btn-secondary">Voltar</a>
        </div>
    </form>

    <script>
        const API_URL = 'http://localhost:3000';
        const params = new URLSearchParams(window.location.search);
        const blocoId = params.get('id');

        const previewImagem = document.getElementById('preview-imagem');
        const inputImagem = document.getElementById('imagem');

        inputImagem.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                previewImagem.src = reader.result;
                previewImagem.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        });

        async function carregarBloco() {
            if (!blocoId) {
                alert('Bloco não informado.');
                window.location.href = 'historicoBlocosChapas.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/blocos/${blocoId}`);
                if (!response.ok) throw new Error('Bloco não encontrado');

                const bloco = await response.json();

                document.getElementById('material').value = bloco.material || '';
                document.getElementById('cor').value = bloco.cor || '';
                document.getElementById('comprimento').value = bloco.comprimento || '';
                document.getElementById('largura').value = bloco.largura || '';
                document.getElementById('altura').value = bloco.altura || '';
                document.getElementById('peso').value = bloco.peso || '';

                if (bloco.imagem) {
                    previewImagem.src = bloco.imagem;
                    previewImagem.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Erro ao carregar bloco:', error);
                alert('Erro ao carregar os dados do bloco.');
                window.location.href = 'historicoBlocosChapas.html';
            }
        }

        document.getElementById('form-editar-bloco').addEventListener('submit', async (event) => {
            event.preventDefault();

            const blocoAtualizado = {
                material: document.getElementById('material').value,
                cor: document.getElementById('cor').value,
                comprimento: parseFloat(document.getElementById('comprimento').value),
                largura: parseFloat(document.getElementById('largura').value),
                altura: parseFloat(document.getElementById('altura').value),
                peso: parseFloat(document.getElementById('peso').value),
                imagem: previewImagem.src || ''
            };

            try {
                const response = await fetch(`${API_URL}/blocos/${blocoId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(blocoAtualizado)
                });

                if (response.ok) {
                    alert('Bloco atualizado com sucesso!');
                    window.location.href = 'historicoBlocosChapas.html';
                } else {
                    const erro = await response.json().catch(() => ({}));
                    alert('Erro ao atualizar bloco: ' + (erro.message || 'Verifique os dados.'));
                }
            } catch (error) {
                console.error('Erro ao atualizar bloco:', error);
                alert('Erro de conexão com o servidor.');
            }
        });

        carregarBloco();
    </script>
</body>
</html>
