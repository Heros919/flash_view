<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cadastro.css">
    <title>Flash View</title>
    <link rel="icon" href="assets/logo.ico" type="image/x-icon">

</head>

<body>

    <div class="container">
        <h1>Flash View</h1>
        <form id="form-usuario" class="formulario">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </p>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script>
        const API_URL = 'http://localhost:3000';

        const form = document.getElementById('form-usuario');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (event) => {
        
        // 1. Impede o recarregamento da página
        event.preventDefault();

        // 2. Coleta os valores dos inputs
        const novoUsuario = {
            cpf: document.getElementById('cpf').value,
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
        };

        // 3. Feedback visual
        mensagem.textContent = 'Cadastrando...';
        mensagem.style.color = 'blue';

        try {
            // 4. Envia para o back-end via POST
            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(novoUsuario),
            });

            // 5. Verifica se deu certo
            if (!response.ok) {
                // Se o back retornou erro (ex: email duplicado), pega a mensagem
                const erro = await response.json();
                throw new Error(erro.message || `Erro ${response.status}`);
            }

            // 6. Pega o usuário criado (sem senha)
            const usuarioCriado = await response.json();

            // 7. Mostra sucesso
            mensagem.textContent = `Usuário "${usuarioCriado.nome}" cadastrado com sucesso!`;
            mensagem.style.color = 'green';

            // 8. Limpa o formulário
            form.reset();

        } catch (error) {
            // Se der erro, mostra na tela
            console.error('Erro:', error);
            mensagem.textContent = `Erro: ${error.message}`;
            mensagem.style.color = 'red';
        }
    });
</script>


</body>
</html>
