<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flash View - Editar Bloco</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <div class="d-flex align-items-center gap-3 mb-4">

        <a href="historicoBlocosChapas.html" class="btn btn-outline-secondary">
            Voltar
        </a>

        <div>
            <h1 class="mb-0">Editar Bloco</h1>
            <small class="text-muted">
                Altere somente o que precisar.
            </small>
        </div>

    </div>


    <div id="mensagem"></div>


    <div class="card">

        <div class="card-body">

            <form id="form-editar-bloco">

                <div class="row g-3">

                    <!-- Código -->

                    <div class="col-md-6">

                        <label for="codigo" class="form-label">
                            Código
                        </label>

                        <input type="text" id="codigo" class="form-control">

                    </div>


                    <!-- Número -->

                    <div class="col-md-6">

                        <label for="numero" class="form-label">
                            Número
                        </label>

                        <input type="number" id="numero" class="form-control" min="0" max="99">

                    </div>


                    <!-- Material -->

                    <div class="col-md-6">

                        <label for="material" class="form-label">
                            Material
                        </label>

                        <input type="text" id="material" class="form-control" maxlength="150">

                    </div>


                    <!-- Cor -->

                    <div class="col-md-6">

                        <label for="cor" class="form-label">
                            Cor
                        </label>

                        <input type="text" id="cor" class="form-control" maxlength="160">

                    </div>


                    <!-- Comprimento -->

                    <div class="col-md-4">

                        <label for="comprimento" class="form-label">
                            Comprimento
                        </label>

                        <input type="number" id="comprimento" class="form-control" step="0.01" min="0.01">

                    </div>


                    <!-- Largura -->

                    <div class="col-md-4">

                        <label for="largura" class="form-label">
                            Largura
                        </label>

                        <input type="number" id="largura" class="form-control" step="0.01" min="0.01">

                    </div>


                    <!-- Altura -->

                    <div class="col-md-4">

                        <label for="altura" class="form-label">
                            Altura
                        </label>

                        <input type="number" id="altura" class="form-control" step="0.01" min="0.01">

                    </div>


                    <!-- Peso -->

                    <div class="col-md-4">

                        <label for="peso" class="form-label">
                            Peso
                        </label>

                        <input type="number" id="peso" class="form-control" step="0.01" min="0.01">

                    </div>


                    <!-- Mês -->

                    <div class="col-md-4">

                        <label for="mes" class="form-label">
                            Mês
                        </label>

                        <input type="number" id="mes" class="form-control" min="1" max="12">

                    </div>


                    <!-- Ano -->

                    <div class="col-md-4">

                        <label for="ano" class="form-label">
                            Ano
                        </label>

                        <input type="number" id="ano" class="form-control" min="2000">

                    </div>


                    <!-- Frente -->

                    <div class="col-md-6">

                        <label for="frente" class="form-label">
                            Frente
                        </label>

                        <select id="frente" class="form-select">

                            <option value="">
                                Selecione
                            </option>

                            <option value="A">
                                A
                            </option>

                            <option value="B">
                                B
                            </option>

                            <option value="C">
                                C
                            </option>

                            <option value="D">
                                D
                            </option>

                            <option value="BARRAGEM">
                                BARRAGEM
                            </option>

                            <option value="BARREIRO">
                                BARREIRO
                            </option>

                        </select>

                    </div>

                    <!-- Imagem -->

                    <div class="col-md-6">

                        <label for="imagem" class="form-label">
                            Imagem do bloco
                        </label>

                        <input type="file" id="imagem" class="form-control" accept="image/*">

                    </div>

                    <div class="col-12">

                        <img
                            id="preview-imagem"
                            src=""
                            alt="Imagem do bloco"
                            class="img-fluid rounded border d-none"
                            style="max-height: 220px;">

                    </div>

                </div>


                <div class="d-flex gap-2 mt-4">

                    <button type="submit" id="btn-salvar" class="btn btn-primary">
                        Salvar alterações
                    </button>

                    <a href="historicoBlocosChapas.html" class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>


    <script src="js/api.js"></script>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const blocoId =
            params.get('id');


        const mensagem =
            document.getElementById('mensagem');


        const form =
            document.getElementById(
                'form-editar-bloco'
            );


        const btnSalvar =
            document.getElementById(
                'btn-salvar'
            );

        const inputImagem =
            document.getElementById('imagem');

        const previewImagem =
            document.getElementById('preview-imagem');

        let imagemSelecionada = null;
        let imagemAtual = '';

        // Ajuste se o seu backend roda em outra porta/endereço
        const API_URL = 'http://localhost:3000';

        // O GET /blocos/:id não devolve a imagem: ela fica na tabela de mídia e é
        // servida por GET /blocos/:id/imagem. Baixamos com o token e mostramos via blob.
        async function carregarImagemAtual(id) {
            try {
                const token = localStorage.getItem('token');

                const resposta = await fetch(
                    `${API_URL}/blocos/${encodeURIComponent(id)}/imagem`,
                    { headers: token ? { Authorization: `Bearer ${token}` } : {} }
                );

                if (!resposta.ok) return ''; // 404 = bloco ainda sem imagem

                const blob = await resposta.blob();
                return URL.createObjectURL(blob);
            } catch (error) {
                console.warn('Não foi possível carregar a imagem atual:', error);
                return '';
            }
        }

        // Envia a imagem como arquivo (multipart), igual ao cadastro de bloco.
        // Nunca em base64 dentro do JSON, que estoura o limite do servidor.
        async function enviarImagemBloco(id, arquivo) {
            const formData = new FormData();
            formData.append('imagem', arquivo);

            const token = localStorage.getItem('token');

            const resposta = await fetch(
                `${API_URL}/blocos/${encodeURIComponent(id)}/imagem`,
                {
                    method: 'POST',
                    headers: token
                        ? { Authorization: `Bearer ${token}` }
                        : {},
                    body: formData
                }
            );

            if (!resposta.ok) {
                let detalhe = '';
                try {
                    const erro = await resposta.json();
                    detalhe = Array.isArray(erro.message)
                        ? erro.message.join(', ')
                        : erro.message || erro.error || '';
                } catch {
                    detalhe = await resposta.text().catch(() => '');
                }
                throw new Error(`Falha ao enviar a imagem. ${detalhe}`);
            }
        }


        inputImagem.addEventListener('change', () => {

            imagemSelecionada = inputImagem.files[0] || null;

            if (!imagemSelecionada) {
                previewImagem.src = imagemAtual;
                previewImagem.classList.toggle('d-none', !imagemAtual);
                return;
            }

            const leitor = new FileReader();

            leitor.onload = () => {
                if (typeof leitor.result !== 'string') {
                    mostrarMensagem(
                        'Não foi possível carregar a imagem selecionada.'
                    );
                    return;
                }

                previewImagem.src = leitor.result;
                previewImagem.classList.remove('d-none');
            };

            leitor.onerror = () => {
                mostrarMensagem(
                    'Não foi possível carregar a imagem selecionada.'
                );
            };

            leitor.readAsDataURL(imagemSelecionada);
        });


        function mostrarMensagem(
            texto,
            tipo = 'danger'
        ) {

            mensagem.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${texto}
                </div>
            `;
        }


        function preencherCampo(
            id,
            valor
        ) {

            const campo =
                document.getElementById(id);

            if (!campo) {
                return;
            }

            if (
                valor !== undefined &&
                valor !== null
            ) {

                campo.value = valor;
            }
        }


        async function carregarBloco() {

            if (!blocoId) {

                mostrarMensagem(
                    'ID do bloco não informado.'
                );

                form.style.display = 'none';

                return;
            }


            try {

                const bloco =
                    await api(
                        `/blocos/${encodeURIComponent(blocoId)}`
                    );


                preencherCampo(
                    'codigo',
                    bloco.codigo
                );

                preencherCampo(
                    'numero',
                    bloco.numero
                );

                preencherCampo(
                    'material',
                    bloco.material
                );

                preencherCampo(
                    'cor',
                    bloco.cor
                );

                preencherCampo(
                    'comprimento',
                    bloco.comprimento
                );

                preencherCampo(
                    'largura',
                    bloco.largura
                );

                preencherCampo(
                    'altura',
                    bloco.altura
                );

                preencherCampo(
                    'peso',
                    bloco.peso
                );

                preencherCampo(
                    'mes',
                    bloco.mes
                );

                preencherCampo(
                    'ano',
                    bloco.ano
                );

                preencherCampo(
                    'frente',
                    bloco.frente
                );

                imagemAtual = await carregarImagemAtual(blocoId);

                if (imagemAtual) {
                    previewImagem.src = imagemAtual;
                    previewImagem.classList.remove('d-none');
                }


            } catch (error) {

                console.error(
                    'Erro ao carregar bloco:',
                    error
                );

                mostrarMensagem(
                    `Não foi possível carregar o bloco: ${error.message}`
                );

                form.style.display = 'none';
            }
        }


        form.addEventListener(
            'submit',
            async event => {

                event.preventDefault();


                if (!blocoId) {

                    mostrarMensagem(
                        'ID do bloco não informado.'
                    );

                    return;
                }


                const dados = {};


                /*
                 * Só adicionamos ao PATCH os campos
                 * que realmente possuem valor.
                 *
                 * Assim o usuário não precisa
                 * preencher tudo novamente.
                 */


                const codigo =
                    document
                        .getElementById('codigo')
                        .value
                        .trim();

                if (codigo !== '') {
                    dados.codigo = codigo;
                }


                const numero =
                    document
                        .getElementById('numero')
                        .value;

                if (numero !== '') {
                    dados.numero =
                        Number(numero);
                }


                const material =
                    document
                        .getElementById('material')
                        .value
                        .trim();

                if (material !== '') {
                    dados.material = material;
                }


                const cor =
                    document
                        .getElementById('cor')
                        .value
                        .trim();

                if (cor !== '') {
                    dados.cor = cor;
                }


                const comprimento =
                    document
                        .getElementById('comprimento')
                        .value;

                if (comprimento !== '') {
                    dados.comprimento =
                        Number(comprimento);
                }


                const largura =
                    document
                        .getElementById('largura')
                        .value;

                if (largura !== '') {
                    dados.largura =
                        Number(largura);
                }


                const altura =
                    document
                        .getElementById('altura')
                        .value;

                if (altura !== '') {
                    dados.altura =
                        Number(altura);
                }


                const peso =
                    document
                        .getElementById('peso')
                        .value;

                if (peso !== '') {
                    dados.peso =
                        Number(peso);
                }


                const mes =
                    document
                        .getElementById('mes')
                        .value;

                if (mes !== '') {
                    dados.mes =
                        Number(mes);
                }


                const ano =
                    document
                        .getElementById('ano')
                        .value;

                if (ano !== '') {
                    dados.ano =
                        Number(ano);
                }


                const frente =
                    document
                        .getElementById('frente')
                        .value;

                if (frente !== '') {
                    dados.frente = frente;
                }

                if (
                    Object.keys(dados).length === 0 &&
                    !imagemSelecionada
                ) {

                    mostrarMensagem(
                        'Nenhuma alteração foi informada.',
                        'warning'
                    );

                    return;
                }


                try {

                    btnSalvar.disabled = true;

                    btnSalvar.textContent =
                        'Salvando...';

                    if (Object.keys(dados).length > 0) {
                        await api(
                            `/blocos/${encodeURIComponent(blocoId)}`,
                            {
                                method: 'PATCH',
                                body: JSON.stringify(dados)
                            }
                        );
                    }

                    if (imagemSelecionada) {
                        btnSalvar.textContent = 'Enviando imagem...';
                        await enviarImagemBloco(blocoId, imagemSelecionada);
                    }


                    mostrarMensagem(
                        'Bloco atualizado com sucesso!',
                        'success'
                    );


                    setTimeout(() => {

                        window.location.href =
                            'historicoBlocosChapas.html';

                    }, 1000);


                } catch (error) {

                    console.error(
                        'Erro ao atualizar bloco:',
                        error
                    );

                    mostrarMensagem(
                        `Não foi possível salvar: ${error.message}`
                    );


                } finally {

                    btnSalvar.disabled = false;

                    btnSalvar.textContent =
                        'Salvar alterações';
                }

            }
        );


        carregarBloco();

    </script>

</body>

</html>
